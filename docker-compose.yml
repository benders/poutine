services:
  hub:
    image: ghcr.io/benders/poutine:latest
    build:
      context: .
      dockerfile: hub/Dockerfile
    ports:
      - "${POUTINE_HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - INSTANCE_CONCURRENCY=11
      - DATABASE_PATH=/app/data/poutine.db
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USERNAME=${NAVIDROME_USERNAME:?Set NAVIDROME_USERNAME in .env}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD:?Set NAVIDROME_PASSWORD in .env}
      - POUTINE_INSTANCE_ID=${POUTINE_INSTANCE_ID:?Set POUTINE_INSTANCE_ID in .env}
      - POUTINE_PRIVATE_KEY_PATH=/app/data/poutine_ed25519.pem
      - POUTINE_OWNER_USERNAME=${POUTINE_OWNER_USERNAME:?Set POUTINE_OWNER_USERNAME in .env}
      - POUTINE_OWNER_PASSWORD=${POUTINE_OWNER_PASSWORD:?Set POUTINE_OWNER_PASSWORD in .env}
      # Optional overrides — empty in prod, used by test/local-cluster/.
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - FANARTTV_API_KEY=${FANARTTV_API_KEY:-}
      - FANARTTV_CLIENT_KEY=${FANARTTV_CLIENT_KEY:-}
      - FANARTTV_API_URL=${FANARTTV_API_URL:-}
      - ART_CACHE_MAX_BYTES=${ART_CACHE_MAX_BYTES:-}
      # Set to 1 only for federation test / local-cluster setups where peers
      # reach each other via RFC1918 / Docker DNS. Leave empty in prod.
      - POUTINE_ALLOW_PRIVATE_PEER_URLS=${POUTINE_ALLOW_PRIVATE_PEER_URLS:-}
      # New Relic APM (issue #3). Agent activates only when the license key is
      # set (in .env — NEVER commit it). App name defaults to
      # poutine-hub-<POUTINE_INSTANCE_ID>; override if needed.
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY:-}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME:-}
      # Sonos casting (issue #108) + DLNA MediaServer (#175). Off by default.
      # To enable Sonos:
      #   1. Switch the hub to host networking (see compose override below)
      #   2. Toggle Sonos on from Admin → Sonos (#184)
      #   3. Set the LAN URL (http://<lan-ip-or-host>:3000) in Admin → Sonos
      # The LAN URL is also shared by DLNA — set it once. Both the enabled
      # flag and the LAN URL are runtime settings — the legacy SONOS_ENABLED
      # and POUTINE_LAN_URL env vars are gone (#184, #209).
      # PUBLIC_DIR is baked into the image (hub/Dockerfile sets it to /app/hub/public).
      # Override here only if you want to mount a custom frontend build.
    volumes:
      - hub-data:/app/data
    depends_on:
      - navidrome
    networks:
      - public
      - internal
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:latest
    environment:
      - ND_LOGLEVEL=info
      - ND_SCANSCHEDULE=1h
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=
      - ND_ENABLEEXTERNALSERVICES=false
      # Purge missing rows at the end of each scan so transient FS unmounts
      # (SMB/NFS/sshfs/Tailscale, sleeping USB volumes) don't permanently
      # quarantine folders via Navidrome's folder.missing=1 flag. See #159
      # and docs/hub-internals.md (Navidrome integration). Trade-off:
      # Navidrome-side annotations on a row that briefly disappears are
      # discarded rather than reattached. Poutine tracks plays via its own
      # activity service, so this is acceptable.
      - ND_SCANNER_PURGEMISSING=always
      # Auto-create the "admin" user on first boot using the same credential
      # the hub uses to connect. Username is always "admin" with this method.
      # In Navidrome 0.52+, the internal config key is DevAutoCreateAdminPassword
      # (env var ND_DEVAUTOCREATEADMINPASSWORD). ND_INITIALADMINPASSWORD is a no-op.
      - ND_DEVAUTOCREATEADMINPASSWORD=${NAVIDROME_PASSWORD:?Set NAVIDROME_PASSWORD in .env}
    volumes:
      - navidrome-data:/data
      - ${NAVIDROME_MUSIC_PATH:-./music}:/music:ro
    # No ports published — Navidrome is only reachable from the hub over the
    # internal Docker network. Admin access to Navidrome should be done via
    # `docker compose exec` or by temporarily publishing a port locally.
    networks:
      - internal
    restart: unless-stopped

volumes:
  hub-data:
  navidrome-data:

networks:
  # Exposed to the host (and, via the operator's reverse proxy / tunnel, to the
  # internet). Hub serves both the API and the React SPA on a single port.
  public:
  # Private network for hub <-> navidrome. Navidrome is never directly exposed.
  internal:
    internal: true
