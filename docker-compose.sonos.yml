# Compose override that switches the hub to host networking so SSDP
# multicast (UDP 1900) and Sonos SOAP control (TCP 1400) work.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.sonos.yml up -d
#
# Side effects:
#   - The `ports:` mapping is ignored under host networking; the hub binds
#     directly to the host's PORT (default 3000). Set POUTINE_HOST_PORT
#     to the port your reverse proxy expects.
#   - The hub joins the host's network instead of Compose's `public` /
#     `internal` networks. Navidrome stays on the internal network, but
#     the hub now reaches it via NAVIDROME_URL=http://127.0.0.1:4533 if
#     navidrome is also on the host, or via the published port if not.
#   - On macOS / Windows Docker Desktop, host networking has limitations.
#     SSDP discovery typically requires a Linux host.
services:
  hub:
    network_mode: host
    # Compose ignores `ports:` in host mode; documented for clarity.
    ports: !reset []
    networks: !reset null
