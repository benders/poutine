name: Node.js CVE watch

# Daily re-check of the pinned Node release (.node-version) against the Node
# project's security releases, so a new CVE surfaces without waiting for a PR (#290).
# A failure here means: bump the pin — docs/hub-internals.md#nodejs-version-policy-290

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Node.js CVE gate
        run: node scripts/check-node-version.mjs
