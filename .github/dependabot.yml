version: 2
updates:
  # Node base image (hub/Dockerfile). Every Node patch release becomes a PR —
  # the only signal we get for runtime CVEs, which GitHub security alerts don't cover (#290).
  # Majors are manual: native addons need a matching ABI (#292).
  # No cooldown: GitHub's 3-day default exempts only security updates, which docker lacks,
  # so it would hold Node security releases too (#304). Official image, built by Docker.
  - package-ecosystem: docker
    directory: /hub
    schedule:
      interval: daily
    cooldown:
      default-days: 0
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Bundled Navidrome (docker-compose.yml). Its security fixes only reach a hub through this
  # pin (#293). 0.x minors can carry one-way DB migrations — back up navidrome-data before
  # rolling a merged bump out (docs/hub-internals.md, Navidrome integration).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: deluan/navidrome
    commit-message:
      prefix: "chore(deps)"
